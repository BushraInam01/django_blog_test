<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>
</head>
<body>

    <h1>My Blog</h1>

    <form method="GET">

        <input
            type="text"
            name="search"
            placeholder="Search blogs..."
            value="{{ request.GET.search }}"
        >

        <select name="sort">

            <option value="">Sort By</option>

            <option value="newest"
                {% if request.GET.sort == "newest" %}selected{% endif %}>
                Newest First
            </option>

            <option value="oldest"
                {% if request.GET.sort == "oldest" %}selected{% endif %}>
                Oldest First
            </option>

        </select>

        <button type="submit">Apply</button>

    </form>


    {% for blog in blogs %}

        <h2>{{ blog.title }}</h2>

        <p>{{ blog.description|truncatewords:10 }}</p>

        <p>{{ blog.created_at|date:"F d, Y" }}</p>

        <a href="{% url 'blog_detail' blog.id %}">
            View Details
        </a>

    {% endfor %}


</body>
</html>

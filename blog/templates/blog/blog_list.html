<!DOCTYPE html>

<html>

<head>

    <title>My Blog</title>

    <style>

        body {
            text-align: left;
        }

        .blog {
            margin-bottom: 20px;
        }

        .blog img {
            width: 250px;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .blog a {
            display: block;
            margin-bottom: 25px;
        }

    </style>

</head>

<body>

    <h1>My Blog</h1>

    <!-- Search and Sorting -->

    <form method="GET">

        <input
            type="text"
            name="search"
            placeholder="Search blogs..."
            value="{{ request.GET.search }}"
        >

        <select name="sort">

            <option value="">Sort By</option>

            <option value="newest"
                {% if request.GET.sort == "newest" %}selected{% endif %}>
                Newest First
            </option>

            <option value="oldest"
                {% if request.GET.sort == "oldest" %}selected{% endif %}>
                Oldest First
            </option>

        </select>

        <button type="submit">Apply</button>

    </form>


    <!-- Blog List -->

    {% for blog in blogs %}

        <div class="blog">

            {% if blog.image %}

                <img
                    src="{{ blog.image.url }}"
                    alt="{{ blog.title }}"
                >

            {% endif %}

            <h2>{{ blog.title }}</h2>

            <p>
                {{ blog.description|truncatewords:10 }}
            </p>

            <p>
                {{ blog.created_at|date:"F d, Y" }}
            </p>

            <a href="{% url 'blog_detail' blog.id %}">
                View Details
            </a>

        </div>

    {% endfor %}


    <!-- Logout -->

    <form method="POST" action="{% url 'logout' %}">

        {% csrf_token %}

        <button type="submit">Logout</button>

    </form>


</body>

</html>

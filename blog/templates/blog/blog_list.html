<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>
</head>
<body>

    <h1>My Blog</h1>

    {% for blog in blogs %}

        <h2>{{ blog.title }}</h2>
        <p>{{ blog.description|truncatewords:10 }}</p>
        <p>{{ blog.created_at|date:"F d, Y" }}</p>

        <a href="{% url 'blog_detail' blog.id %}">View Details</a>

    {% endfor %}

</body>
</html>
